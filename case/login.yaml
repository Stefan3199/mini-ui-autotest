- name: 登录成功
  tags: [smoke, login]
  url: /login
  method: POST
  params:
    user: test001
    pwd: "right123"
  expect:
    - field: code
      op: eq
      value: 0
    - field: ok
      op: eq
      value: true
    - field: token
      op: not_null

- name: 登录失败
  tags: [smoke, login]
  url: /login
  method: POST
  params:
    user: test001
    pwd: "wrong"
  expect:
    - field: code
      op: eq
      value: 1
    - field: ok
      op: eq
      value: false