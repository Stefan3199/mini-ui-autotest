name: test

on:
  push:
  pull_request:

jobs:
  # 先跑框架自己的单测：不依赖网络，几秒出结果
  unit:
    name: 框架自测 (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  # 再跑 demo 端到端：起被测服务，跑全部用例，上传报告
  e2e:
    name: 端到端 (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start demo server (unix)
        if: runner.os != 'Windows'
        run: |
          python demo/login_server.py > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:9300/echo > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start"; cat server.log; exit 1

      - name: Start demo server (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath python -ArgumentList 'demo/login_server.py' -RedirectStandardOutput server.log -RedirectStandardError server.err -PassThru | Out-Null
          for ($i = 0; $i -lt 30; $i++) {
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:9300/echo' -UseBasicParsing -TimeoutSec 2 | Out-Null
              Write-Host 'server ready'
              exit 0
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          Write-Host 'server did not start'
          Get-Content server.log, server.err -ErrorAction SilentlyContinue
          exit 1

      - name: Run suite
        run: python run.py --workers 4

      - name: Show result.json summary
        if: always()
        run: python -c "import json;d=json.load(open('report/result.json',encoding='utf-8'));print(d['summary'])"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            report/report.html
            report/junit.xml
            report/result.json
            server.log
